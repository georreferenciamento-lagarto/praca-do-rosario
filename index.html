        <style>

        :root {
            --ui-bg: rgba(255, 255, 255, 0.94);
            --ui-text: #173629;
            --ui-muted: #5f6f67;
            --ui-accent: #2f6b4f;
            --ui-border: rgba(23, 54, 41, 0.16);
            --ui-shadow: 0 8px 28px rgba(20, 38, 30, 0.16);
        }

        html, body, #map {
            width: 100%;
            height: 100%;
            padding: 0;
            margin: 0;
        }

        html, body {
            font-family: Inter, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #eef2ef;
            overflow: hidden;
        }

        #map {
            background: #e8eee9;
        }

        .map-title {
            position: fixed;
            top: 14px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1100;
            max-width: calc(100vw - 150px);
            padding: 10px 18px;
            border: 1px solid var(--ui-border);
            border-radius: 14px;
            background: var(--ui-bg);
            color: var(--ui-text);
            box-shadow: var(--ui-shadow);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            font-size: 20px;
            font-weight: 700;
            letter-spacing: -0.02em;
            text-align: center;
            white-space: nowrap;
            pointer-events: none;
        }

        .map-footer {
            position: fixed;
            left: 50%;
            bottom: 10px;
            transform: translateX(-50%);
            z-index: 1100;
            width: max-content;
            max-width: calc(100vw - 24px);
            padding: 8px 14px;
            border: 1px solid var(--ui-border);
            border-radius: 12px;
            background: var(--ui-bg);
            color: var(--ui-muted);
            box-shadow: var(--ui-shadow);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            font-size: 11px;
            line-height: 1.45;
            text-align: center;
            pointer-events: none;
        }

        .map-footer strong {
            color: var(--ui-text);
            font-weight: 650;
        }

        /* Controles Leaflet */
        .leaflet-bar,
        .leaflet-control-layers,
        .leaflet-control-measure,
        .leaflet-control-locate {
            border: 1px solid var(--ui-border) !important;
            border-radius: 12px !important;
            box-shadow: 0 5px 18px rgba(20, 38, 30, 0.14) !important;
            overflow: hidden;
        }

        .leaflet-bar a,
        .leaflet-bar a:hover,
        .leaflet-control-locate a {
            border: 0 !important;
            color: var(--ui-text) !important;
            background-color: rgba(255, 255, 255, 0.95) !important;
        }

        .leaflet-bar a:hover,
        .leaflet-control-locate a:hover {
            background-color: #edf5f0 !important;
            color: var(--ui-accent) !important;
        }

        .leaflet-control-layers {
            background: var(--ui-bg) !important;
            color: var(--ui-text);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        .leaflet-control-layers-expanded {
            padding: 10px 12px !important;
        }

        .leaflet-control-layers label {
            margin: 4px 0;
        }

        /* Pop-ups */
        .leaflet-popup-content-wrapper {
            border: 1px solid var(--ui-border);
            border-radius: 14px !important;
            box-shadow: var(--ui-shadow) !important;
            color: var(--ui-text);
        }

        .leaflet-popup-content {
            margin: 14px 16px !important;
            min-width: 180px;
            font-size: 13px;
            line-height: 1.45;
        }

        .leaflet-popup-content table {
            width: 100%;
            border-collapse: collapse;
        }

        .leaflet-popup-content th,
        .leaflet-popup-content td {
            padding: 6px 4px;
            vertical-align: top;
            border-bottom: 1px solid rgba(23, 54, 41, 0.08);
        }

        .leaflet-popup-content tr:last-child th,
        .leaflet-popup-content tr:last-child td {
            border-bottom: 0;
        }

        .leaflet-popup-content th {
            color: var(--ui-muted);
            font-weight: 600;
            text-align: left;
            padding-right: 10px;
        }

        .leaflet-popup-content img {
            display: block;
            max-width: min(320px, 70vw);
            height: auto;
            margin-top: 8px;
            border-radius: 10px;
        }

        .leaflet-popup-tip {
            box-shadow: none !important;
        }

        /* Atribuição acima do rodapé */
        .leaflet-bottom.leaflet-right {
            bottom: 58px;
        }

        .leaflet-control-attribution {
            border-radius: 8px 0 0 0;
            background: rgba(255, 255, 255, 0.86) !important;
            color: #66746d;
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
        }

        /* Mantém os controles superiores livres do título */
        .leaflet-top {
            top: 58px;
        }

        @media (max-width: 640px) {
            .map-title {
                top: 8px;
                max-width: calc(100vw - 110px);
                padding: 8px 13px;
                border-radius: 12px;
                font-size: 16px;

            .map-footer {
                bottom: 7px;
                width: calc(100vw - 28px);

            }

            .map-footer span {
                display: block;
            }

            .leaflet-top {
                top: 48px;
            }

            .leaflet-bottom.leaflet-right {
                bottom: 72px;
            }

            .leaflet-popup-content {
                min-width: 150px;
                max-width: 72vw;
            }
        }

        <script>
        var map = L.map('map', {
            zoomControl:false, maxZoom:28, minZoom:19

        var hash = new L.Hash(map);
        map.attributionControl.setPrefix('<a href="https://github.com/qgis2web/qgis2web" target="_blank">qgis2web</a> &middot; <a href="https://leafletjs.com" title="A JS library for interactive maps">Leaflet</a> &middot; <a href="https://qgis.org">QGIS</a>');
        var autolinker = new Autolinker({truncate: {length: 30, location: 'smart'}});
        // remove popup's row if "visible-with-data"
        function removeEmptyRowsFromPopupContent(content, feature) {
         var tempDiv = document.createElement('div');
         tempDiv.innerHTML = content;
         var rows = tempDiv.querySelectorAll('tr');
         for (var i = 0; i < rows.length; i++) {
             var td = rows[i].querySelector('td.visible-with-data');
             var key = td ? td.id : '';
             if (td && td.classList.contains('visible-with-data') && feature.properties[key] == null) {
                 rows[i].parentNode.removeChild(rows[i]);
             }
         }
         return tempDiv.innerHTML;
        }
        // modify popup if contains media
        function addClassToPopupIfMedia(content, popup) {
            var tempDiv = document.createElement('div');
            tempDiv.innerHTML = content;
            var imgTd = tempDiv.querySelector('td img');
            if (imgTd) {
                var src = imgTd.getAttribute('src');
                if (/\.(jpg|jpeg|png|gif|bmp|webp|avif)$/i.test(src)) {
                    popup._contentNode.classList.add('media');
                    var img = popup._contentNode.querySelector('td img');
                    if (img) {
                        // If already loaded (cache), update immediately
                        if (img.complete && img.naturalHeight > 0) {
                            popup.update();
                        } else {
                            img.addEventListener('load', function() {
                                popup.update();
                            });
                            img.addEventListener('error', function() {
                                popup.update();
                            });
                        }
                    }
                } else if (/\.(mp3|wav|ogg|aac)$/i.test(src)) {
                    var audio = document.createElement('audio');
                    audio.controls = true;
                    audio.src = src;
                    imgTd.parentNode.replaceChild(audio, imgTd);
                    popup._contentNode.classList.add('media');
                    setTimeout(function() {
                        popup.setContent(tempDiv.innerHTML);
                        popup.update();
                    }, 10);
                } else if (/\.(mp4|webm|ogg|mov)$/i.test(src)) {
                    var video = document.createElement('video');
                    video.controls = true;
                    video.src = src;
                    video.style.width = "400px";
                    video.style.height = "300px";
                    video.style.maxHeight = "60vh";
                    video.style.maxWidth = "60vw";
                    imgTd.parentNode.replaceChild(video, imgTd);
                    popup._contentNode.classList.add('media');
                    // Aggiorna il popup quando il video carica i metadati
                    video.addEventListener('loadedmetadata', function() {
                        popup.update();
                    });
                    setTimeout(function() {
                        popup.setContent(tempDiv.innerHTML);
                        popup.update();
                    }, 10);
                } else {
                    popup._contentNode.classList.remove('media');
                }
            } else {
                popup._contentNode.classList.remove('media');
            }
        }
        var zoomControl = L.control.zoom({
            position: 'topleft'
        }).addTo(map);
        L.control.locate({locateOptions: {maxZoom: 19}}).addTo(map);
        var measureControl = new L.Control.Measure({
            position: 'topleft',
            primaryLengthUnit: 'meters',
            secondaryLengthUnit: 'kilometers',
            primaryAreaUnit: 'sqmeters',
            secondaryAreaUnit: 'hectares'

        measureControl.addTo(map);
        document.getElementsByClassName('leaflet-control-measure-toggle')[0].innerHTML = '';

            var popupContent = '<table>\

                        <td colspan="2">' + (feature.properties['nome'] !== null ? autolinker.link(String(feature.properties['nome']).replace(/'/g, "\\'").toLocaleString()) : '') + '</td>\

                </table>';
            var content = removeEmptyRowsFromPopupContent(popupContent, feature);
            layer.on('popupopen', function(e) {
                addClassToPopupIfMedia(content, e.popup);
            });
            layer.bindPopup(content, { maxHeight: 400 });
        }

                weight: 1.0, 
                fill: true,
                fillOpacity: 1,
                fillColor: 'rgba(255,0,2,0.0)',
                interactive: true,
            }
                    break;

        }
        map.createPane('pane_praca_1');
        map.getPane('pane_praca_1').style.zIndex = 401;
        map.getPane('pane_praca_1').style['mix-blend-mode'] = 'normal';
        var layer_praca_1 = new L.geoJson(json_praca_1, {
